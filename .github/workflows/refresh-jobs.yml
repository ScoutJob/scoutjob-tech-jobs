name: Refresh public jobs

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate public feed
        run: python scripts/generate_feed.py

      - name: Commit updated feed
        run: |
          git config user.name "scoutjob-bot"
          git config user.email "scoutjob-bot@users.noreply.github.com"
          git add data/jobs.json data/jobs.csv
          git diff --cached --quiet || git commit -m "Refresh public job feed"
          git push
