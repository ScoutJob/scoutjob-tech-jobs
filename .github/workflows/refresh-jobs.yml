name: Refresh public jobs

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write

concurrency:
  group: refresh-public-jobs
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate public feed
        run: python scripts/generate_feed.py

      - name: Verify GitHub Pages feed copy
        run: |
          cmp data/jobs.json docs/data/jobs.json
          cmp data/jobs.csv docs/data/jobs.csv

      - name: Commit updated feed
        run: |
          git config user.name "scoutjob-bot"
          git config user.email "scoutjob-bot@users.noreply.github.com"

          git add \
            data/jobs.json \
            data/jobs.csv \
            docs/data/jobs.json \
            docs/data/jobs.csv \
            README.md

          git diff --cached --quiet || git commit -m "Refresh public job feed"

          git pull --rebase origin main
          git push origin main
