<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ScoutJob Public Tech Jobs</title>
  <meta name="description" content="Delayed public feed of fresh tech jobs found by ScoutJob." />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="container">
    <header>
      <h1>Fresh Tech Jobs Found by ScoutJob</h1>
      <p>Delayed public feed of engineering, data, AI, and internship roles.</p>
      <p><a href="https://www.scoutjob.me/" target="_blank" rel="noopener">Try ScoutJob for earlier access</a></p>
    </header>

    <section class="filters">
      <input id="search" type="search" placeholder="Search title or company" />
      <select id="country"><option value="">All countries</option></select>
      <select id="category"><option value="">All role categories</option></select>
    </section>

    <p id="status">Loading jobs...</p>
    <section id="jobs" class="jobs"></section>
  </main>

  <script src="./app.js"></script>
</body>
</html>
